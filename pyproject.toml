[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survagent"
version = "0.2.0"
description = "Validated survival-analysis tools exposed to AI agents through MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "mcp>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "lifelines>=0.27"]
rag = ["pypdf>=4", "sentence-transformers>=2.6"]

[project.scripts]
survagent-mcp = "survagent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
